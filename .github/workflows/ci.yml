name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Linux jobs run on a fresh kyora VM (kyora-2x4-apac: 2 vCPU / 4 GB, in apac, else us). Fork pull
# requests stay on GitHub-hosted runners, so they never wait for a runner that won't come. macOS has
# no kyora runner and stays on GitHub's, as does the ci-ok gate (one shell test, no VM needed).

jobs:
  fmt:
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'kyora-2x4-apac' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os != 'ubuntu-latest' && matrix.os || (github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'kyora-2x4-apac') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os != 'ubuntu-latest' && matrix.os || (github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'kyora-2x4-apac') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo test --workspace --locked

  ci-ok:
    if: ${{ always() }}
    needs: [fmt, clippy, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          CHECKS_PASSED: ${{ needs.fmt.result == 'success' && needs.clippy.result == 'success' && needs.test.result == 'success' }}
        run: test "$CHECKS_PASSED" = true
